<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatRecall 💬 — Semantic Group Chat Retrieval</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --accent-green: #10b981;
      --accent-yellow: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --highlight-bg: rgba(16, 185, 129, 0.15);
      --highlight-border: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 2rem 1.5rem 1rem;
      text-align: center;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .brand h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 650px;
      margin: 0 auto 1.25rem;
      line-height: 1.5;
    }

    .upload-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .upload-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px dashed var(--accent-cyan);
      color: #38bdf8;
      font-weight: 600;
      padding: 0.55rem 1.2rem;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .upload-btn:hover {
      background: rgba(6, 182, 212, 0.15);
      transform: translateY(-1px);
    }

    .reset-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 0.55rem 0.9rem;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: #ef4444;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.05);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
    }

    .active-source-badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #34d399;
      font-weight: 600;
    }

    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
    }

    .search-box {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1rem 1.25rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 1.15rem;
      font-family: inherit;
    }

    .search-input::placeholder {
      color: #6b7280;
    }

    .search-btn {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s, transform 0.1s;
    }

    .search-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .sample-queries {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      align-items: center;
    }

    .sample-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .query-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-size: 0.82rem;
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .query-chip:hover {
      background: rgba(6, 182, 212, 0.15);
      border-color: var(--accent-cyan);
      color: white;
    }

    .plan-banner {
      background: rgba(22, 30, 49, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .plan-tags {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
    }

    .badge-semantic { background: rgba(6, 182, 212, 0.2); color: #38bdf8; border: 1px solid #0284c7; }
    .badge-person { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #d97706; }
    .badge-time { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #059669; }
    .badge-decision { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid #9333ea; }

    .comparison-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 900px) {
      .comparison-grid {
        grid-template-columns: 1fr;
      }
    }

    .column-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      margin-bottom: 1.5rem;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .result-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .card-header {
      padding: 0.85rem 1.25rem;
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.85rem;
    }

    .score-badge {
      font-family: 'JetBrains Mono', monospace;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
    }

    .thread-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .chat-bubble {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      font-size: 0.95rem;
      line-height: 1.4;
      transition: all 0.2s;
    }

    .bubble-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .sender-name {
      font-weight: 600;
      color: #93c5fd;
    }

    .chat-bubble.is-target {
      background: var(--highlight-bg);
      border-color: var(--highlight-border);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
    }

    .chat-bubble.is-target .sender-name {
      color: #34d399;
    }

    .chat-bubble.is-decision {
      border-left: 3px solid #c084fc;
    }

    .lexical-card {
      background: rgba(22, 30, 49, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      font-size: 0.88rem;
    }

    .lexical-note {
      font-size: 0.8rem;
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      margin-top: 0.5rem;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent-cyan);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>ChatRecall</h1>
      <span class="badge badge-semantic">v0.2.0</span>
    </div>
    <p class="subtitle">
      Semantic Search over Messy Group Chat Archives.
      Upload any WhatsApp/Telegram exported <code>.txt</code> file or search the synthetic archive.
    </p>

    <!-- Upload & Reset Section -->
    <div class="upload-container">
      <input type="file" id="fileUploadInput" accept=".txt,.json" style="display: none;" />
      <button class="upload-btn" id="uploadBtn">
        <span>📁 Upload Custom Chat (.txt / .json)</span>
      </button>
      <button class="reset-btn" id="resetBtn" title="Reset to default 4,000+ message synthetic archive">
        <span>↺ Reset to Default Chat</span>
      </button>
    </div>

    <!-- Active Stats Bar -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-pill active-source-badge" id="sourceBadge">💬 Source: Synthetic Group Chat (Default)</div>
      <div class="stat-pill" id="msgCountBadge">📊 4,020 Messages</div>
      <div class="stat-pill" id="participantBadge">👥 8 Participants</div>
      <div class="stat-pill">🌐 Multilingual MiniLM</div>
    </div>
  </header>

  <main>
    <div class="search-box">
      <input 
        type="text" 
        id="queryInput" 
        class="search-input" 
        placeholder="Ask anything (e.g., 'When did we decide on the mountain trip?', 'Priya budget advice')..." 
      />
      <button class="search-btn" id="searchBtn">Search</button>
    </div>

    <div class="sample-queries">
      <span class="sample-label">Try sample queries:</span>
      <button class="query-chip" data-query="When did we decide on the mountain holiday?">🏔️ Mountain Trip (Zero Overlap)</button>
      <button class="query-chip" data-query="Surprise reading gadget ordered for our friend moving abroad">🎁 Farewell Gift (Zero Overlap)</button>
      <button class="query-chip" data-query="What did Priya say about the budget?">👤 Priya Budget Advice</button>
      <button class="query-chip" data-query="What did we discuss in December regarding advance tax?">📅 December Tax Discussions</button>
    </div>

    <div id="resultsContainer"></div>
  </main>

  <script>
    const queryInput = document.getElementById('queryInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultsContainer = document.getElementById('resultsContainer');
    const fileUploadInput = document.getElementById('fileUploadInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const resetBtn = document.getElementById('resetBtn');

    const sourceBadge = document.getElementById('sourceBadge');
    const msgCountBadge = document.getElementById('msgCountBadge');
    const participantBadge = document.getElementById('participantBadge');

    // Fetch initial stats
    fetchStats();

    async function fetchStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        sourceBadge.textContent = `💬 Source: ${data.source_name}`;
        msgCountBadge.textContent = `📊 ${data.total_messages.toLocaleString()} Messages`;
        participantBadge.textContent = `👥 ${data.participants.length} Participants`;
      } catch (err) {
        console.error("Failed to fetch stats", err);
      }
    }

    // Upload Handler
    uploadBtn.addEventListener('click', () => fileUploadInput.click());

    fileUploadInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      resultsContainer.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p><strong>Uploading & Indexing ${file.name}...</strong></p>
          <p style="font-size: 0.85rem; margin-top: 0.5rem;">Parsing timestamps, senders, and generating multilingual vector embeddings...</p>
        </div>
      `;

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || "Upload failed");
        }

        await fetchStats();
        resultsContainer.innerHTML = `
          <div class="result-card" style="padding: 1.5rem; text-align: center; border-color: #10b981;">
            <h3 style="color: #34d399; margin-bottom: 0.5rem;">✅ Custom Chat Loaded Successfully!</h3>
            <p style="color: #cbd5e1; font-size: 0.95rem;">
              Indexed <strong>${data.total_messages.toLocaleString()} messages</strong> across <strong>${data.participants.length} participants</strong> from <code>${data.source_name}</code>.
            </p>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.5rem;">
              You can now type search queries above to retrieve messages from your custom chat!
            </p>
          </div>
        `;
      } catch (err) {
        resultsContainer.innerHTML = `<div class="loading" style="color: #ef4444;">Upload error: ${err.message}</div>`;
      }
      fileUploadInput.value = '';
    });

    // Reset Handler
    resetBtn.addEventListener('click', async () => {
      resultsContainer.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>Resetting to default synthetic chat archive...</p>
        </div>
      `;
      try {
        await fetch('/api/reset', { method: 'POST' });
        await fetchStats();
        resultsContainer.innerHTML = `
          <div class="result-card" style="padding: 1.25rem; text-align: center; border-color: #06b6d4;">
            <h3 style="color: #38bdf8;">↺ Reset to Default Synthetic Chat (4,020 msgs)</h3>
          </div>
        `;
      } catch (err) {
        resultsContainer.innerHTML = `<div class="loading" style="color: #ef4444;">Reset error: ${err.message}</div>`;
      }
    });

    // Sample Query Chips
    document.querySelectorAll('.query-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        queryInput.value = btn.dataset.query;
        performSearch();
      });
    });

    searchBtn.addEventListener('click', performSearch);
    queryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') performSearch();
    });

    async function performSearch() {
      const q = queryInput.value.trim();
      if (!q) return;

      resultsContainer.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>Running semantic query router & embedding search...</p>
        </div>
      `;

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&top_k=3&window=3`);
        const data = await res.json();
        renderResults(data);
      } catch (err) {
        resultsContainer.innerHTML = `<div class="loading" style="color: #ef4444;">Error fetching results: ${err.message}</div>`;
      }
    }

    function renderResults(data) {
      const plan = data.plan;
      const results = data.semantic_results;
      const lexical = data.lexical_baseline;

      let badgesHtml = `<span class="badge badge-${plan.strategy}">${plan.strategy}</span>`;
      if (plan.target_person) {
        badgesHtml += `<span class="badge badge-person">👤 ${plan.target_person}</span>`;
      }
      if (plan.time_range) {
        badgesHtml += `<span class="badge badge-time">📅 ${plan.time_range[0]} to ${plan.time_range[1]}</span>`;
      }
      if (plan.is_decision_query) {
        badgesHtml += `<span class="badge badge-decision">🎯 Decision Resolution</span>`;
      }

      let alertHtml = '';
      if (data.no_confident_match) {
        alertHtml = `
          <div style="background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 10px; padding: 0.75rem 1rem; margin-bottom: 1.5rem; color: #fbbf24; font-size: 0.88rem; display: flex; align-items: center; gap: 0.5rem;">
            <span>⚠️</span>
            <span><strong>Low Match Confidence:</strong> No candidate scored above the relevance cutoff (threshold: ${data.threshold}). Showing closest results below.</span>
          </div>
        `;
      }

      let html = `
        <div class="plan-banner">
          <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <div style="font-size: 0.85rem; color: var(--text-muted);">
              Query: <strong style="color: #f1f5f9;">"${escapeHtml(data.literal_query || data.query)}"</strong>
            </div>
            <div class="plan-tags">
              <span style="font-size: 0.85rem; color: var(--text-muted);">Strategy:</span>
              ${badgesHtml}
            </div>
          </div>
          <span style="font-size: 0.85rem; color: var(--text-muted);">
            Evaluated ${data.candidate_count} candidates in <strong>${data.source_name || 'Active Chat'}</strong>
          </span>
        </div>

        ${alertHtml}

        <div class="comparison-grid">
          <div>
            <div class="column-title">
              <span>✨ Semantic Retrieval (Distinct Threads, Deduplicated)</span>
            </div>
      `;

      if (results.length === 0) {
        html += `<p style="color: var(--text-muted); padding: 1rem;">No matching messages found.</p>`;
      } else {
        results.forEach((r, idx) => {
          const decBadge = r.is_decision ? `<span class="badge badge-decision" style="font-size: 0.7rem;">Decision Outcome</span>` : '';
          const confColor = r.confidence === 'high' ? '#34d399' : (r.confidence === 'medium' ? '#38bdf8' : '#fbbf24');
          const confBadge = `<span class="badge" style="background: rgba(255,255,255,0.06); color: ${confColor}; border: 1px solid ${confColor}40;">${r.confidence.toUpperCase()} CONFIDENCE</span>`;
          html += `
            <div class="result-card">
              <div class="card-header">
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                  <strong style="color: #cbd5e1;">Match #${r.rank} (${r.id})</strong>
                  ${decBadge}
                  ${confBadge}
                </div>
                <div class="score-badge">Similarity: ${r.score}</div>
              </div>
              <div class="thread-body">
          `;

          const ctxMsgs = r.thread_context.messages;
          ctxMsgs.forEach(cm => {
            const isTarget = cm.is_target ? 'is-target' : '';
            const isDec = cm.is_decision ? 'is-decision' : '';
            html += `
              <div class="chat-bubble ${isTarget} ${isDec}">
                <div class="bubble-meta">
                  <span class="sender-name">${cm.sender} ${cm.is_target ? '👉' : ''}</span>
                  <span>${cm.formatted_time}</span>
                </div>
                <div>${escapeHtml(cm.message)}</div>
              </div>
            `;
          });

          html += `
              </div>
            </div>
          `;
        });
      }

      html += `
          </div>
          <div>
            <div class="column-title">
              <span>🔤 Keyword Search Baseline (BM25)</span>
            </div>
      `;

      if (lexical.length === 0) {
        html += `
          <div class="lexical-card">
            <div class="lexical-note">⚠️ Keyword search found 0 matches. Text search fails when words don't overlap!</div>
          </div>
        `;
      } else {
        lexical.forEach(lm => {
          html += `
            <div class="lexical-card">
              <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.3rem;">
                <strong>${lm.sender}</strong> • ${lm.timestamp} (Score: ${lm.score})
              </div>
              <div style="color: #94a3b8;">${escapeHtml(lm.message)}</div>
            </div>
          `;
        });
      }

      html += `
          </div>
        </div>
      `;

      resultsContainer.innerHTML = html;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
